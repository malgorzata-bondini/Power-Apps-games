      - Oceny:
          Control: HtmlViewer@2.1.0
          Properties:
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =85
            HoverBorderColor: =RGBA(23, 21, 15, 0)
            HtmlText: |-
              =With({sr: Average(Filter(colRecenzje As r, r.FilmId = gblPick.FilmId) As q, q.Ocena), ile: CountRows(Filter(colRecenzje As r, r.FilmId = gblPick.FilmId))},
              If(ile > 0,
              "<div style='display:block;box-sizing:border-box;height:74px;padding:6px 0 0 0;font-family:Segoe UI,sans-serif;text-align:right'>" &
              "<div style='display:inline-block;text-align:center'>" &
              "<div style='font-family:Consolas,monospace;font-style:italic;font-size:12px;line-height:18px;letter-spacing:.12em;text-transform:uppercase;color:#8B8677;white-space:nowrap;padding-left:2px'>" & Text(sr, "0") & " / 5 &nbsp;&nbsp; " & ile & If(ile = 1, " ocena", " ocen") & "</div>" &
              "<div style='font-size:34px;line-height:40px;letter-spacing:.12em;color:#C9A227;white-space:nowrap'>" & Left("★★★★★", RoundDown(sr, 0)) & "<span style='color:#D8D3C4'>" & Left("☆☆☆☆☆", 5 - RoundDown(sr, 0)) & "</span></div>" &
              "</div>" &
              "</div>",
              "<div style='position:relative;height:74px;background:#F8F6F0;box-sizing:border-box;margin:0;font-family:Consolas,monospace'>" &
              "<div style='position:absolute;left:0;right:0;top:0;height:5px;background-image:radial-gradient(circle at 5px 0px, #EFEDE4 4px, transparent 4.5px);background-size:10px 5px'></div>" &
              "<div style='position:absolute;left:0;right:0;bottom:0;height:5px;background-image:radial-gradient(circle at 5px 5px, #EFEDE4 4px, transparent 4.5px);background-size:10px 5px'></div>" &
              "<div style='position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:11px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;color:#8B8677;padding:0 26px'>Nikt tego jeszcze nie ocenił, kliknij i bądź bohaterem!</div>" &
              "</div>"))
            PaddingRight: =4.50
            Size: =11
            Tooltip: ="Przejdź do sekcji z oceną"
            Visible: = gblHasPick && gblSpinLeft = 0
            Width: =268
            X: =599
            Y: =292
