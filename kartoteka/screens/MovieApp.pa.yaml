Screens:
  MovieApp:
    Properties:
      Fill: =RGBA(239, 237, 228, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =ClearCollect(colRecenzje, Recenzje)
    Children:
      - Timer1.Value:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Duration: =180
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =0
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnTimerEnd: |-
              =Set(gblFlickFilm, If(gblSpinLeft > 1, First(Shuffle(colPool)), gblFlickFilm));
              Set(gblSpinLeft, Max(gblSpinLeft - 1, 0))
            PaddingRight: =4.50
            PaddingTop: =4.50
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Repeat: =true
            Size: =0.00
            Width: =0.00
            X: =35.99
            Y: =40
      - Losuj:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(251, 248, 242, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(166, 35, 26, 1)
            FocusedBorderColor: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =false
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =42
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(251, 248, 242, 1)
            HoverFill: =RGBA(142, 29, 21, 1)
            OnSelect: |-
              =Set(gblSpinLeft, 14);
              If(CountRows(Filter(colPool As f, !(f.FilmId in colSeen.FilmId))) = 0, Clear(colSeen));
              With({fresh: Filter(colPool As f, !(f.FilmId in colSeen.FilmId))},
                  Set(gblPick, First(Shuffle(fresh)))
              );
              Collect(colSeen, {FilmId: gblPick.FilmId});
              Set(gblHasPick, true);
              Set(gblSpinLeft, 14)
            PaddingRight: =4.50
            PaddingTop: =4.50
            PressedBorderColor: =RGBA(110, 22, 16, 1)
            PressedColor: =RGBA(251, 248, 242, 1)
            PressedFill: = RGBA(110, 22, 16, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =9.90
            Text: ="Losuj"
            Width: =118
            X: =31
            Y: =301
      - Karta:
          Control: HtmlViewer@2.1.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =374
            HtmlText: |-
              =With({f: If(gblSpinLeft > 0 && !IsBlank(gblFlickFilm.Tytul), gblFlickFilm, gblPick), plakat: LookUp(colPlakaty As p, p.FilmId = If(gblSpinLeft > 0 && !IsBlank(gblFlickFilm.Tytul), gblFlickFilm, gblPick).FilmId, p.Url)},
              "<div style='background:#F8F6F0;border-top:1px solid #D8D3C4;border-bottom:1px solid #D8D3C4;padding:28px " & If(!IsBlank(plakat), "280px", "40px") & " 28px 40px;box-sizing:border-box;min-height:330px;position:relative;font-family:Segoe UI,sans-serif'>" &
              "<div style='position:absolute;left:0;top:0;bottom:0;width:22px;background-color:#17150F;background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#F8F6F0 9px 21px)'></div>" &
              "<div style='position:absolute;right:0;top:0;bottom:0;width:22px;background-color:#17150F;background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#F8F6F0 9px 21px)'></div>" &
              If(!IsBlank(plakat), "<img src='" & plakat & "' style='position:absolute;top:50%;right:69px;transform:translateY(-50%);width:165px;height:248px;background:#EFEDE4;border:1px solid #D8D3C4'>", "") &
              "<p style='font-family:Consolas,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A6231A;margin:0 0 18px'>" & f.Rok & " &nbsp; &nbsp; " & f.CzasText & " &nbsp; &nbsp; reż. " & f.Rezyser & "</p>" &
              "<p style='font-family:Georgia,serif;font-weight:400;color:" & If(gblSpinLeft > 0, "#8B8677", "#17150F") & ";font-size:34px;line-height:1.08;letter-spacing:-.015em;margin:0 0 18px;overflow-wrap:break-word'>" & f.Tytul & "</p>" &
              If(!IsBlank(f.Cytat),
              "<div style='margin:0 0 14px;padding:0 0 0 20px;border-left:2px solid #A6231A;font-family:Georgia,serif;font-style:italic;color:#17150F;font-size:19px;line-height:1.34;text-align:justify'><span style='display:block;font-family:Consolas,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8B8677;margin:0 0 7px;font-style:normal;text-align:left'>Sławny cytat</span>„" & f.Cytat & "”</div>",
              "<p style='margin:0 0 14px;color:#4A463C;font-size:16px;text-align:justify'><span style='display:block;font-family:Consolas,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8B8677;margin:0 0 7px;text-align:left'>Scena, którą się pamięta</span>" & f.Scena & "</p>") &
              "<p style='margin:0 0 16px;color:#4A463C;font-size:15px;text-align:justify'>" & f.Zdanie & "</p>" &
              "<div style='margin:0'>" & Concat(Split(f.Nastroje, ", "), "<span style='display:inline-block;font-family:Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8B8677;border:1px solid #D8D3C4;padding:5px 10px;margin:0 6px 6px 0'>" & Value & "</span>") & "</div>" &
              "<a href='https://www.google.com/search?q=" & Substitute(f.Tytul & " " & f.Rok, " ", "+") & "' target='_blank' style='position:relative;top:5px;font-family:Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#17150F;text-decoration:none;border-bottom:1px solid #A6231A;padding-bottom:3px'>Przejdźmy do konkretów</a>" &
              "</div>"
              )
            PaddingRight: =4.50
            PaddingTop: =4.50
            Size: =10.80
            Visible: =gblHasPick
            Width: =841
            X: =26
            Y: =385
      - PustaRamka:
          Control: HtmlViewer@2.1.0
          Properties:
            Font: =Font.'Open Sans'
            Height: =339
            HtmlText: |-
              ="<div style='background:#F8F6F0;border-top:1px solid #D8D3C4;border-bottom:1px solid #D8D3C4;padding:30px 50px;box-sizing:border-box;min-height:280px;position:relative;font-family:Segoe UI,sans-serif'>" &
              "<div style='position:absolute;left:0;top:0;bottom:0;width:22px;background-color:#17150F;background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#F8F6F0 9px 21px)'></div>" &
              "<div style='position:absolute;right:0;top:0;bottom:0;width:22px;background-color:#17150F;background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#F8F6F0 9px 21px)'></div>" &
              "<p style='font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:19px;line-height:1.45;color:#8B8677;margin:5px 0 0'>Naciśnij „Losuj” i odkryj swoje filmowe przeznaczenie.</p>" &
              "</div>"
            PaddingRight: =4.50
            PaddingTop: =4.50
            Size: =10.80
            Visible: =!gblHasPick
            Width: =841
            X: =26
            Y: =394
      - Header:
          Control: HtmlViewer@2.1.0
          Properties:
            Font: =Font.'Open Sans'
            Height: =247
            HtmlText: |-
              ="<p style='font-family:Consolas,monospace;font-size:16px;letter-spacing:.20em;text-transform:uppercase;color:#A6231A;margin:0 2 22px'>Kartoteka&nbsp;&nbsp;&nbsp;" & CountRows(colFilms) & " tytułów</p>" &
              "<p style='font-family:Georgia,serif;font-weight:400;font-size:46px;line-height:1.03;letter-spacing:-.02em;color:#17150F;margin:0 0 18px;white-space:nowrap'>Polska klasyka<br><i style='color:#4A463C'>na piątek wieczór</i></p>" &
              "<p style='color:#4A463C;margin:0 0 14px;font-size:14px;line-height:1.16'>Masz ochotę na polskie kino, ale nie wiesz co wybrać? Ustaw nastrój, a resztę zostaw losowi i odkryj swoje filmowe przeznaczenie.</p>" &
              "<div style='height:14px;margin:0 0 24px;background-color:#17150F;background-image:repeating-linear-gradient(to right,transparent 0 7px,#EFEDE4 7px 15px)'></div>"
            PaddingRight: =4.50
            PaddingTop: =4.50
            Size: =11.70
            Width: =1329
            X: =26.99
      - Pula:
          Control: HtmlViewer@2.1.0
          Properties:
            Font: =Font.'Open Sans'
            Height: =30
            HtmlText: |+
              ="<p style='font-family:Consolas,monospace;font-size:12px;letter-spacing:.04em;color:#8B8677;margin:0'>" &
              With({fresh: CountRows(Filter(colPool As f, !(f.FilmId in colSeen.FilmId))),
                    pool: CountRows(colPool), all: CountRows(colFilms)},
              If(pool = 0,     "brak dopasowań, zdejmij filtr",
                 fresh < pool, fresh & " jeszcze do wylosowania z " & pool & " w puli" & If(pool < all, " (" & all & " ogółem)", ""),
                 pool < all,   pool & " z " & all & " tytułów w puli",
                               pool & " tytułów w puli")) &
              "</p>"
            PaddingRight: =4.50
            Size: =11.70
            Width: =394
            X: =26
            Y: =355
