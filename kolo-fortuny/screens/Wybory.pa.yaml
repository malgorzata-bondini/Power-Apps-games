            HoverFill: =RGBA(0,0,0,0)
            OnSelect: |-
              =If(!gblKrecenie, Set(gblIdx, RandBetween(1, CountRows(colKolo))); Set(gblTemat, LookUp(colKolo, Nr = gblIdx).Temat); Set(gblKat0, Mod(gblKat, 360)); Set(gblKatCel, gblKat0 + 1440 + Mod(360 - (gblIdx - 0.5) * (360 / CountRows(colKolo)) - gblKat0, 360)); If(CountRows(colGracze) > 0, With({pula: If(gblPowtorka >= 2 && CountRows(colGracze) > 1, Filter(colGracze As o, o.Imie <> gblOsoba), colGracze)}, Set(gblNowa, First(Shuffle(pula)).Imie)); Set(gblPowtorka, If(gblNowa = gblOsoba, gblPowtorka + 1, 1)); Set(gblOsoba, gblNowa), Set(gblOsoba, ""); Set(gblPowtorka, 0)); If(CountRows(Filter(colPytania As q, q.Temat = gblTemat && !(q.Id in colWidziane.Id))) = 0, RemoveIf(colWidziane, Temat = gblTemat)); With({sw: Filter(colPytania As q, q.Temat = gblTemat && !(q.Id in colWidziane.Id))}, If(CountRows(sw) > 0, Set(gblPytanie, First(Shuffle(sw))); Collect(colWidziane, {Id: gblPytanie.Id, Temat: gblPytanie.Temat}))); Set(gblMaPytanie, false); Set(gblKrecenie, true))
