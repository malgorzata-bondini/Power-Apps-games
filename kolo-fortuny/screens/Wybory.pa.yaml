            Height: =178
            HtmlText: ="<div style='font-family:Segoe UI,sans-serif;text-align:center'><p style='font-family:Consolas,monospace;font-size:20px;letter-spacing:.38em;text-transform:uppercase;color:#F2C14E;margin:0 0 14px'>Gotowi?</p><h1 style='font-family:Georgia,serif;font-weight:400;font-size:35px;line-height:1.04;color:#FFF3D6;margin:0 0 16px'>Losuj pytanie, losuj wyzwanie!</h1><p style='font-size:18px;line-height:1.6;color:#E6BFA8;margin:0 auto;max-width:48ch'>Zakręć kołem, poznaj kategorię i ...przygotuj się na walkę o pizzę z ananasem!</p></div>"
