 "<div style='position:absolute;left:" & Round((s - d) / 2, 0) & "px;top:" & Round((s - d) / 2, 0) & "px;width:" & d & "px;height:" & d & "px;border-radius:50%;box-shadow:0 0 0 " & r1 & "px #FFF3D6, 0 0 0 " & r2 & "px #F2C14E, 0 0 0 " & r3 & "px #B8862A, 0 " & Round(s * 0.04, 0) & "px " & Round(s * 0.077, 0) & "px rgba(0,0,0,.45);overflow:hidden'>" & "<div style='position:absolute;left:0;top:0;width:" & d & "px;height:" & d & "px;border-radius:50%;transform:rotate(" & kat & "deg);background:conic-gradient(" & Concat(colKolo As w, Switch(Mod(w.Nr, 5), 1, "#EDBE4E", 2, "#2A8C5B", 3, "#DCBE9A", 4, "#CE5218", "#9E2A2E") & " " & (w.Nr - 1) * 36 & "deg " & w.Nr * 36 & "deg", ",") & ")'>" & If(win, "<div style='position:absolute;left:0;top:0;width:" & d & "px;height:" & d & "px;border-radius:50%;background:conic-gradient(transparent 0deg " & (gblIdx - 1) * 36 & "deg,rgba(38,20,15,.3) " & (gblIdx - 1) * 36 & "deg " & gblIdx * 36 & "deg,transparent " & gblIdx * 36 & "deg 360deg)'></div>", "") & "<div style='position:absolute;left:0;top:0;width:" & d & "px;height:" & d & "px;border-radius:50%;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 34%,rgba(0,0,0,0) 56%,rgba(0,0,0,.22) 100%)'></div>" & Concat(colKolo As w, "<span style='position:absolute;left:" & Round(d / 2 + 0.35 * d * w.Sx - 0.125 * d, 0) & "px;top:" & Round(d / 2 - 0.35 * d * w.Cy - 0.6 * fs, 0) & "px;width:" & Round(d * 0.25, 0) & "px;text-align:center;white-space:nowrap;transform-origin:" & Round(d * 0.125, 0) & "px " & Round(fs * 0.6, 0) & "px;transform:rotate(" & w.Kat & "deg);font-family:Segoe UI,Arial,sans-serif;font-size:" & fs & "px;font-weight:600;letter-spacing:.01em;color:" & Switch(Mod(w.Nr, 5), 1, "#26140F", 3, "#26140F", "#FFF8E7") & "'>" & w.Temat & "</span>") & "</div></div>" & "<div style='position:absolute;left:" & Round((s - hb) / 2, 0) & "px;top:" & Round((s - hb) / 2, 0) & "px;width:" & hb & "px;height:" & hb & "px;border-radius:50%;background:radial-gradient(circle at 36% 28%,#FFFBEE 0%,#FFF3D6 52%,#E8D5B0 100%);box-shadow:0 0 0 " & Round(s * 0.013, 0) & "px #B8862A, 0 " & Round(s * 0.019, 0) & "px " & Round(s * 0.04, 0) & "px rgba(0,0,0,.45), inset 0 -3px 9px rgba(0,0,0,.12)" & If(win, ", 0 0 " & Round(s * 0.068, 0) & "px " & Round(s * 0.019, 0) & "px rgba(255,213,79,.7)", "") & "'></div>" & "<div style='position:absolute;left:" & (c - pw) & "px;top:" & Round(s * 0.008, 0) & "px;width:0;height:0;border-left:" & pw & "px solid transparent;border-right:" & pw & "px solid transparent;border-top:" & ph & "px solid #FFF3D6;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))'></div>" & "</div></div>"))
            PaddingLeft: =0
            PaddingTop: =0
            Width: =If(Parent.Width < 980, Min(Parent.Width - 64, 460), Min(NaglowekW.Width, 520))
            X: =If(Parent.Width < 980, (Parent.Width - Self.Width) / 2, NaglowekW.X + NaglowekW.Width + 48 + (NaglowekW.Width - Self.Width) / 2)
