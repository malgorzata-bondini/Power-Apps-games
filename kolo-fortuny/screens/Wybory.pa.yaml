order-radius:26px;box-sizing:border-box;padding:20px 30px;background:#F2C14E;box-shadow:0 10px 22px rgba(0,0,0,.4);color:#26140F;font-family:Georgia,serif;font-size:" & fp & "px;line-height:1.32'>" & ta & "</div>", "<div style='display:flex;align-items:center;justify-content:center;gap:10px'><span style='display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:" & kw & "px;height:" & kw & "px;border-radius:50%;box-sizing:border-box;padding:12px;background:#F2C14E;box-shadow:0 10px 22px rgba(0,0,0,.42);color:#26140F;font-family:Georgia,serif;font-size:" & fs & "px;line-height:1.2;overflow-wrap:break-word'>" & ta & "</span><span style='display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,193,78,.55);background:rgba(0,0,0,.25);font-family:Georgia,serif;font-size:16px;font-style:italic;color:#F2C14E'>vs</span><span style='display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:" & kw & "px;height:" & kw & "px;border-radius:50%;box-sizing:border-box;padding:12px;background:#2FA36B;box-shadow:0 10px 22px rgba(0,0,0,.42);color:#FFF3D6;font-family:Georgia,serif;font-size:" & fs & "px;line-height:1.2;overflow-wrap:break-word'>" & tb & "</span></div>" ) & "</div>" ) ) ) )
